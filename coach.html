<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAKU Coach Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --dark: #0D0F14;
    --panel: #13161E;
    --panel2: #1A1E2A;
    --border: #2A2F40;
    --text: #D0D6E8;
    --muted: #5A6080;
    --accent: #3A7BFF;
    --success: #2ECC71;
    --danger: #E74C3C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 0% 0%, rgba(58,123,255,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(123,58,255,0.06) 0%, transparent 50%);
  }

  header {
    background: linear-gradient(135deg, #0D0F14 0%, #1A1030 100%);
    border-bottom: 2px solid var(--gold);
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo-text {
    font-family: 'Rajdhani', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .user-info {
    text-align: right;
  }

  .user-name {
    color: var(--gold);
    font-weight: 700;
  }

  .btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Exo 2', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn.primary { background: var(--gold); color: #000; font-weight: 700; }
  .btn.danger { color: var(--danger); }

  .toolbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 40px;
    display: flex;
    gap: 12px;
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 40px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .card-header {
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
  }

  .card-body { padding: 20px; }

  .student-list {
    max-height: 600px;
    overflow-y: auto;
  }

  .student-item {
    padding: 12px;
    margin-bottom: 8px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .student-item:hover {
    background: rgba(201, 168, 76, 0.1);
    border-color: var(--gold);
  }

  .student-item.active {
    background: rgba(201, 168, 76, 0.2);
    border-color: var(--gold);
  }

  .student-name {
    font-weight: 600;
    color: var(--text);
  }

  .student-email {
    font-size: 11px;
    color: var(--muted);
  }

  .remove-btn {
    background: var(--danger);
    color: white;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }

  .add-student {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }

  .add-student input {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 8px;
    outline: none;
  }

  .add-student input:focus {
    border-color: var(--gold);
  }

  .student-view {
    display: none;
  }

  .student-view.active {
    display: block;
  }

  .student-header {
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    margin-bottom: 20px;
  }

  .student-header h2 {
    color: var(--gold);
    margin-bottom: 5px;
  }

  .student-header p {
    color: var(--muted);
    font-size: 12px;
  }

  .profile-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  .info-field {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
  }

  .info-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .info-value {
    color: var(--text);
    font-weight: 600;
  }

  .coach-notes-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .coach-notes-section h3 {
    color: var(--gold);
    margin-bottom: 15px;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .coach-textarea {
    width: 100%;
    min-height: 150px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
    padding: 12px;
    outline: none;
    resize: vertical;
  }

  .coach-textarea:focus {
    border-color: var(--gold);
  }

  .button-group {
    display: flex;
    gap: 12px;
    margin-top: 15px;
  }

  .divider { height: 1px; background: var(--border); margin: 20px 0; }

  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--muted);
  }

  .empty-state p {
    margin-bottom: 10px;
  }

  .link-box {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin-top: 15px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .link-box input {
    flex: 1;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 12px;
    padding: 6px 8px;
    outline: none;
  }

  .copy-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <div class="logo-text">🎮 PAKU COACH</div>
  <div class="user-info">
    <div class="user-name" id="coachName">Wird geladen...</div>
    <button class="btn" onclick="logout()">Logout</button>
  </div>
</header>

<div class="toolbar">
  <button class="btn primary" onclick="saveCoachNotes()">💾 Notizen speichern</button>
  <button class="btn" onclick="location.href='index.html'">← Academy</button>
</div>

<main>

  <!-- SCHÜLER LISTE -->
  <div class="card">
    <div class="card-header">👥 Meine Schüler</div>
    <div class="card-body">
      <div class="add-student">
        <input type="email" id="studentEmail" placeholder="Schüler E-Mail" />
        <button class="btn primary" onclick="addStudent()" style="width: 100%;">+ Hinzufügen</button>
      </div>
      <div class="divider"></div>
      <div class="student-list" id="studentList"></div>
    </div>
  </div>

  <!-- SCHÜLER DETAILS -->
  <div id="studentDetails" class="empty-state">
    <p>Wähle einen Schüler aus der Liste</p>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    projectId: "paku-academy",
    apiKey: "AIzaSyBONrlg2hMKFL9WKSAg7v11uhQ72QsMX7k",
    authDomain: "paku-academy.firebaseapp.com",
    databaseURL: "https://paku-academy-default-rtdb.europe-west1.firebasedatabase.app"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentCoach = null;
  let currentStudent = null;
  let students = [];

  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      window.location.href = 'coach-login.html';
      return;
    }

    currentCoach = user;
    document.getElementById('coachName').textContent = user.email.split('@')[0];
    
    await loadCoachData();
    await loadStudents();
  });

  async function loadCoachData() {
    try {
      const doc = await db.collection('coaches').doc(currentCoach.uid).get();
      if (doc.exists) {
        students = doc.data().students || [];
      }
    } catch (error) {
      console.error('Error loading coach data:', error);
    }
  }

  async function loadStudents() {
    const listDiv = document.getElementById('studentList');
    listDiv.innerHTML = '';

    for (const studentId of students) {
      try {
        const userDoc = await db.collection('users').doc(studentId).get();
        if (userDoc.exists) {
          const data = userDoc.data();
          const item = document.createElement('div');
          item.className = 'student-item';
          item.innerHTML = `
            <div onclick="selectStudent('${studentId}');" style="flex: 1; cursor: pointer;">
              <div class="student-name">${data.name || 'Unbekannt'}</div>
              <div class="student-email">${data.email}</div>
            </div>
            <button class="remove-btn" onclick="removeStudent('${studentId}'); event.stopPropagation();">×</button>
          `;
          item.id = `student-${studentId}`;
          listDiv.appendChild(item);
        }
      } catch (error) {
        console.error('Error loading student:', error);
      }
    }
  }

  async function addStudent() {
    const email = document.getElementById('studentEmail').value.trim();
    if (!email) {
      alert('E-Mail eingeben!');
      return;
    }

    try {
      // Finde Schüler per Email
      const query = await db.collection('users').where('email', '==', email).get();
      if (query.empty) {
        alert('Schüler mit dieser E-Mail nicht gefunden');
        return;
      }

      const studentId = query.docs[0].id;
      
      // Prüfe ob bereits hinzugefügt
      if (students.includes(studentId)) {
        alert('Schüler ist bereits in deiner Liste');
        return;
      }

      // Füge hinzu
      students.push(studentId);
      await db.collection('coaches').doc(currentCoach.uid).update({
        students: students
      });

      // Speichere auch Coach-ID beim Schüler
      await db.collection('dashboard').doc(studentId).set({
        coachId: currentCoach.uid,
        coachEmail: currentCoach.email
      }, { merge: true });

      document.getElementById('studentEmail').value = '';
      await loadStudents();
      alert('✅ Schüler hinzugefügt!');
    } catch (error) {
      alert('Error: ' + error.message);
      console.error(error);
    }
  }

  async function removeStudent(studentId) {
    if (!confirm('Schüler wirklich entfernen?')) return;

    students = students.filter(id => id !== studentId);
    await db.collection('coaches').doc(currentCoach.uid).update({
      students: students
    });

    // Entferne auch Coach-ID beim Schüler
    await db.collection('dashboard').doc(studentId).set({
      coachId: firebase.firestore.FieldValue.delete(),
      coachEmail: firebase.firestore.FieldValue.delete()
    }, { merge: true });

    if (currentStudent === studentId) {
      currentStudent = null;
      document.getElementById('studentDetails').innerHTML = '<p>Wähle einen Schüler aus der Liste</p>';
    }

    await loadStudents();
  }

  async function selectStudent(studentId) {
    currentStudent = studentId;

    // Update UI
    document.querySelectorAll('.student-item').forEach(item => item.classList.remove('active'));
    document.getElementById(`student-${studentId}`).classList.add('active');

    // Lade Schüler-Daten
    try {
      const userDoc = await db.collection('users').doc(studentId).get();
      const dashDoc = await db.collection('dashboard').doc(studentId).get();

      const userData = userDoc.data() || {};
      const dashData = dashDoc.data() || {};

      // Generate Share Link
      const shareLink = `${window.location.origin}/Paku-Academy/coach-view.html?student=${studentId}&coach=${currentCoach.uid}`;

      const html = `
        <div class="student-header">
          <h2>${userData.name || 'Schüler'}</h2>
          <p>${userData.email}</p>
        </div>

        <div class="profile-info">
          <div class="info-field">
            <div class="info-label">Jetziges Elo</div>
            <div class="info-value">${dashData.eloNow || '—'}</div>
          </div>
          <div class="info-field">
            <div class="info-label">Peak Elo</div>
            <div class="info-value">${dashData.eloPeak || '—'}</div>
          </div>
          <div class="info-field">
            <div class="info-label">Main Role</div>
            <div class="info-value">${dashData.role || '—'}</div>
          </div>
          <div class="info-field">
            <div class="info-label">Champions</div>
            <div class="info-value">${dashData.champions || '—'}</div>
          </div>
        </div>

        <div class="coach-notes-section">
          <h3>📝 Coach Notizen</h3>
          <textarea class="coach-textarea" id="coachNotesInput" placeholder="Deine Notizen für diesen Schüler...">${dashData.coachNotes || ''}</textarea>
          
          <div class="link-box">
            <input type="text" value="${shareLink}" readonly style="font-size: 11px;" />
            <button class="copy-btn" onclick="copyLink()">Kopieren</button>
          </div>
        </div>
      `;

      document.getElementById('studentDetails').innerHTML = html;
    } catch (error) {
      console.error('Error loading student details:', error);
      alert('Error loading student details');
    }
  }

  async function saveCoachNotes() {
    if (!currentStudent) {
      alert('Wähle erst einen Schüler');
      return;
    }

    const notes = document.getElementById('coachNotesInput').value;

    try {
      await db.collection('dashboard').doc(currentStudent).set({
        coachNotes: notes
      }, { merge: true });

      alert('✅ Notizen gespeichert!');
    } catch (error) {
      alert('Error: ' + error.message);
      console.error(error);
    }
  }

  function copyLink() {
    const input = document.querySelector('.link-box input');
    input.select();
    document.execCommand('copy');
    alert('Link kopiert!');
  }

  function logout() {
    auth.signOut().then(() => {
      window.location.href = 'coach-login.html';
    });
  }
</script>

</body>
</html>
