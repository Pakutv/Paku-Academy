<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAKU Coach Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --dark: #0D0F14;
    --panel: #13161E;
    --panel2: #1A1E2A;
    --border: #2A2F40;
    --text: #D0D6E8;
    --muted: #5A6080;
    --accent: #3A7BFF;
    --danger: #E74C3C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #0D0F14 0%, #1A1030 100%);
    border-bottom: 2px solid var(--gold);
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo-text { font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
  .user-name { color: var(--gold); font-weight: 700; }
  .btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 7px 16px; border-radius: 6px; cursor: pointer; font-family: 'Exo 2', sans-serif; font-size: 12px; letter-spacing: 1px; transition: all 0.2s; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn.primary { background: var(--gold); color: #000; font-weight: 700; }

  .toolbar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 40px; display: flex; gap: 12px; }

  main { max-width: 1200px; margin: 0 auto; padding: 32px 40px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
  .card-header { background: var(--panel2); border-bottom: 1px solid var(--border); padding: 14px 20px; font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  .card-body { padding: 20px; }

  .code-box {
    background: var(--panel2);
    border: 2px solid var(--gold);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
  }

  .code-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .code-value {
    font-family: monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 15px;
    word-break: break-all;
  }

  .copy-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    width: 100%;
  }

  .copy-btn:hover {
    background: #2a6aef;
  }

  .instructions {
    background: rgba(58, 123, 255, 0.1);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 15px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.6;
    margin-top: 20px;
  }

  .instructions strong {
    color: var(--gold);
  }

  .divider { height: 1px; background: var(--border); margin: 20px 0; }
</style>
</head>
<body>

<header>
  <div class="logo-text">🎮 PAKU COACH</div>
  <div>
    <div class="user-name" id="coachName">Wird geladen...</div>
    <button class="btn" onclick="logout()">Logout</button>
  </div>
</header>

<div class="toolbar">
  <button class="btn" onclick="location.href='index.html'">← Academy</button>
</div>

<main>
  <div class="card">
    <div class="card-header">🔑 Dein Coach-Code</div>
    <div class="card-body">
      <div class="code-box">
        <div class="code-label">Eindeutiger Coach-Code</div>
        <div class="code-value" id="coachCodeDisplay">Wird geladen...</div>
        <button class="copy-btn" onclick="copyCoachCode()">📋 Code kopieren</button>
      </div>

      <div class="instructions">
        <strong>So funktioniert's:</strong><br>
        1. Teile deinen Code mit deinem Schüler<br>
        2. Schüler öffnet sein Dashboard<br>
        3. Tab "👨‍🏫 Coach" → gibt deinen Code ein<br>
        4. ✅ Fertig! Ihr seid verbunden
      </div>
    </div>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    projectId: "paku-academy",
    apiKey: "AIzaSyBONrlg2hMKFL9WKSAg7v11uhQ72QsMX7k",
    authDomain: "paku-academy.firebaseapp.com",
    databaseURL: "https://paku-academy-default-rtdb.europe-west1.firebasedatabase.app"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentCoach = null;

  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      window.location.href = 'coach-login.html';
      return;
    }
    currentCoach = user;
    document.getElementById('coachName').textContent = user.email.split('@')[0];
    await initializeCoachCode();
  });

  async function initializeCoachCode() {
    try {
      const doc = await db.collection('coaches').doc(currentCoach.uid).get();
      
      let coachCode = doc.data()?.coachCode;
      
      if (!coachCode) {
        coachCode = generateCode();
        const coachName = doc.data()?.name || currentCoach.email.split('@')[0];
        
        await db.collection('coaches').doc(currentCoach.uid).set({
          coachCode: coachCode,
          coachName: coachName
        }, { merge: true });
      }
      
      document.getElementById('coachCodeDisplay').textContent = coachCode;
    } catch (error) {
      console.error('Error initializing coach code:', error);
      alert('Fehler beim Laden des Codes');
    }
  }

  function generateCode() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let code = '';
    for (let i = 0; i < 8; i++) {
      code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return code;
  }

  function copyCoachCode() {
    const code = document.getElementById('coachCodeDisplay').textContent;
    const textarea = document.createElement('textarea');
    textarea.value = code;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    alert('✅ Code kopiert!');
  }

  function logout() {
    auth.signOut().then(() => {
      window.location.href = 'coach-login.html';
    });
  }
</script>

</body>
</html>
