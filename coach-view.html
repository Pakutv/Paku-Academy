<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAKU Coach View</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --dark: #0D0F14;
    --panel: #13161E;
    --panel2: #1A1E2A;
    --border: #2A2F40;
    --text: #D0D6E8;
    --muted: #5A6080;
    --success: #2ECC71;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #0D0F14 0%, #1A1030 100%);
    border-bottom: 2px solid var(--gold);
    padding: 24px 40px;
  }

  .logo-text {
    font-family: 'Rajdhani', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .toolbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 40px;
    display: flex;
    gap: 12px;
  }

  .btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Exo 2', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn.primary { background: var(--gold); color: #000; font-weight: 700; }

  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 32px 40px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .card-header {
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
  }

  .card-body { padding: 20px; }

  .student-info {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 20px;
  }

  .info-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .info-value {
    color: var(--text);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .coach-textarea {
    width: 100%;
    min-height: 200px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
    padding: 12px;
    outline: none;
    resize: vertical;
  }

  .coach-textarea:focus {
    border-color: var(--gold);
  }

  .button-group {
    display: flex;
    gap: 12px;
    margin-top: 15px;
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
  }

  .error {
    background: rgba(220, 53, 69, 0.2);
    border: 1px solid #dc3545;
    color: #ff6b6b;
    padding: 20px;
    border-radius: 6px;
    text-align: center;
  }

  .success-message {
    background: rgba(46, 204, 113, 0.2);
    border: 1px solid var(--success);
    color: var(--success);
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 20px;
    display: none;
  }

  .success-message.show {
    display: block;
  }
</style>
</head>
<body>

<header>
  <div class="logo-text">🎮 PAKU COACH VIEW</div>
</header>

<div class="toolbar">
  <button class="btn primary" onclick="saveNotes()">💾 Speichern</button>
  <button class="btn" onclick="history.back()">← Zurück</button>
</div>

<main>
  <div id="content" class="loading">Wird geladen...</div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    projectId: "paku-academy",
    apiKey: "AIzaSyBONrlg2hMKFL9WKSAg7v11uhQ72QsMX7k",
    authDomain: "paku-academy.firebaseapp.com",
    databaseURL: "https://paku-academy-default-rtdb.europe-west1.firebasedatabase.app"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  const params = new URLSearchParams(window.location.search);
  const studentId = params.get('student');
  const coachId = params.get('coach');

  let studentData = {};
  let dashData = {};

  async function loadData() {
    const content = document.getElementById('content');

    if (!studentId || !coachId) {
      content.innerHTML = '<div class="error">❌ Ungültiger Link</div>';
      return;
    }

    try {
      // Lade Schüler-Daten
      const userDoc = await db.collection('users').doc(studentId).get();
      const dashDoc = await db.collection('dashboard').doc(studentId).get();

      if (!userDoc.exists) {
        content.innerHTML = '<div class="error">❌ Schüler nicht gefunden</div>';
        return;
      }

      studentData = userDoc.data() || {};
      dashData = dashDoc.data() || {};

      // Rendere UI
      content.innerHTML = `
        <div class="success-message" id="successMsg">✅ Notizen gespeichert!</div>

        <div class="card">
          <div class="card-header">📋 Coach Notizen</div>
          <div class="card-body">
            <div class="student-info">
              <div class="info-label">Schüler</div>
              <div class="info-value">${studentData.name || 'Unbekannt'}</div>
              
              <div class="info-label">E-Mail</div>
              <div class="info-value">${studentData.email}</div>
            </div>

            <h3 style="color: var(--gold); margin-bottom: 15px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;">Deine Notizen</h3>
            <textarea class="coach-textarea" id="notesInput" placeholder="Coach-Notizen für diesen Schüler...">${dashData.coachNotes || ''}</textarea>

            <div class="button-group">
              <button class="btn primary" onclick="saveNotes()" style="flex: 1;">💾 Speichern</button>
            </div>
          </div>
        </div>
      `;
    } catch (error) {
      console.error('Error:', error);
      content.innerHTML = '<div class="error">❌ Fehler beim Laden der Daten</div>';
    }
  }

  async function saveNotes() {
    const notes = document.getElementById('notesInput').value;

    try {
      await db.collection('dashboard').doc(studentId).set({
        coachNotes: notes
      }, { merge: true });

      const msg = document.getElementById('successMsg');
      msg.classList.add('show');
      setTimeout(() => msg.classList.remove('show'), 2000);
    } catch (error) {
      alert('Error: ' + error.message);
      console.error(error);
    }
  }

  loadData();
</script>

</body>
</html>
