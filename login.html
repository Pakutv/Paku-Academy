<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAKU Academy — Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #1a2845 100%);
            color: #dcdcdc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: linear-gradient(135deg, #1a2845 0%, #2a3a55 100%);
            border: 2px solid #c89b3c;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(200, 155, 60, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #c89b3c;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            color: #ceb478;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #c89b3c;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #c89b3c;
            border-radius: 6px;
            background: rgba(42, 58, 85, 0.5);
            color: #dcdcdc;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #ffc107;
            background: rgba(42, 58, 85, 0.8);
            box-shadow: 0 0 10px rgba(200, 155, 60, 0.3);
        }

        input::placeholder {
            color: #666;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        .btn-login {
            background: linear-gradient(135deg, #c89b3c, #785a28);
            color: #0a1428;
            border: 2px solid #c89b3c;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 155, 60, 0.4);
        }

        .btn-register {
            background: transparent;
            color: #c89b3c;
            border: 2px solid #c89b3c;
        }

        .btn-register:hover {
            background: rgba(200, 155, 60, 0.1);
            transform: translateY(-2px);
        }

        .error-message {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9em;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #51cf66;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9em;
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 0.9em;
        }

        .toggle-form a {
            color: #c89b3c;
            cursor: pointer;
            text-decoration: underline;
        }

        .toggle-form a:hover {
            color: #ffc107;
        }

        .loading {
            display: none;
            text-align: center;
            color: #c89b3c;
            font-size: 0.9em;
        }

        #loginForm {
            display: block;
        }

        #registerForm {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <h1>🎮 PAKU ACADEMY</h1>
            <p>League of Legends Coaching</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <div id="loadingMessage" class="loading">Wird verarbeitet...</div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">E-Mail</label>
                <input type="email" id="loginEmail" placeholder="deine@email.de" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Passwort</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <div class="button-group">
                <button type="submit" class="btn-login">Login</button>
                <button type="button" class="btn-register" onclick="toggleForm()">Registrieren</button>
            </div>
            <div class="toggle-form">
                Kein Account? <a onclick="toggleForm()">Jetzt registrieren</a>
            </div>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm">
            <div class="form-group">
                <label for="registerName">Name</label>
                <input type="text" id="registerName" placeholder="Dein Name" required>
            </div>
            <div class="form-group">
                <label for="registerEmail">E-Mail</label>
                <input type="email" id="registerEmail" placeholder="deine@email.de" required>
            </div>
            <div class="form-group">
                <label for="registerPassword">Passwort</label>
                <input type="password" id="registerPassword" placeholder="Min. 6 Zeichen" required>
            </div>
            <div class="form-group">
                <label for="registerPasswordConfirm">Passwort wiederholen</label>
                <input type="password" id="registerPasswordConfirm" placeholder="Min. 6 Zeichen" required>
            </div>
            <div class="button-group">
                <button type="submit" class="btn-login">Account erstellen</button>
                <button type="button" class="btn-register" onclick="toggleForm()">Zurück zum Login</button>
            </div>
            <div class="toggle-form">
                Hast du bereits einen Account? <a onclick="toggleForm()">Hier anmelden</a>
            </div>
        </form>
    </div>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            projectId: "paku-academy",
            apiKey: "AIzaSyBONrlg2hMKFL9WKSAg7v11uhQ72QsMX7k",
            authDomain: "paku-academy.firebaseapp.com",
            databaseURL: "https://paku-academy-default-rtdb.europe-west1.firebasedatabase.app"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check if already logged in
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        function toggleForm() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
            
            clearMessages();
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function clearMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        function setLoading(isLoading) {
            document.getElementById('loadingMessage').style.display = isLoading ? 'block' : 'none';
        }

        // LOGIN HANDLER
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();
            setLoading(true);

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                showSuccess('Login erfolgreich! Du wirst weitergeleitet...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } catch (error) {
                setLoading(false);
                if (error.code === 'auth/user-not-found') {
                    showError('Benutzer nicht gefunden.');
                } else if (error.code === 'auth/wrong-password') {
                    showError('Passwort ist falsch.');
                } else if (error.code === 'auth/invalid-email') {
                    showError('E-Mail ist ungültig.');
                } else {
                    showError('Login fehlgeschlagen: ' + error.message);
                }
            }
        });

        // REGISTER HANDLER
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();
            setLoading(true);

            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

            // Validation
            if (name.length < 2) {
                showError('Name muss mindestens 2 Zeichen lang sein.');
                setLoading(false);
                return;
            }

            if (password !== passwordConfirm) {
                showError('Passwörter stimmen nicht überein.');
                setLoading(false);
                return;
            }

            if (password.length < 6) {
                showError('Passwort muss mindestens 6 Zeichen lang sein.');
                setLoading(false);
                return;
            }

            try {
                // Create user
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Save user data to Firestore
                await db.collection('users').doc(user.uid).set({
                    name: name,
                    email: email,
                    createdAt: new Date(),
                    completedCourses: [],
                    lastLogin: new Date()
                });

                showSuccess('Account erstellt! Du wirst angemeldet...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } catch (error) {
                setLoading(false);
                if (error.code === 'auth/email-already-in-use') {
                    showError('Diese E-Mail wird bereits verwendet.');
                } else if (error.code === 'auth/weak-password') {
                    showError('Passwort ist zu schwach. Verwende Groß-, Kleinbuchstaben und Zahlen.');
                } else if (error.code === 'auth/invalid-email') {
                    showError('E-Mail ist ungültig.');
                } else {
                    showError('Registration fehlgeschlagen: ' + error.message);
                }
            }
        });
    </script>
</body>
</html>
